<!doctype html>
<html lang="sr-Latn" data-v="2.6.1 · 2026-11-28">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffc11b">
  <title>Moj Novi Sad — Transkript</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="brand.js"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="brand.css">
  <script src="version.js"></script>
  <script src="install.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="brand">
    <div class="brand-inner">
      <img class="logo" src="brand/logo.png" alt="Moj Novi Sad" width="48" height="47">
      <div class="brand-text">
        <span class="app-name" data-i18n="appShort"></span>
        <span class="privacy" data-i18n="privacy"></span>
        <span class="version" id="app-version"></span>
      </div>
      <button id="asr-pill" class="btn small asr-pill" type="button" data-i18n-title="asrPillHint" hidden></button>
      <button id="install" class="btn primary install" type="button" data-i18n="install" hidden></button>
      <button id="theme" class="btn ghost theme" type="button"><span class="theme-icon" aria-hidden="true"></span> <span class="theme-label"></span></button>
      <button id="settings" class="btn ghost settings" type="button" data-i18n="settings"></button>
    </div>
  </header>

  <main id="start" class="view">
    <h1 class="sr-only" data-i18n="appName"></h1>
    <p id="start-msg" class="msg" role="status" hidden></p>
    <section id="asr-card" class="asr-card" hidden>
      <h2 data-i18n="asrTitle"></h2>
      <p class="muted" data-i18n="asrHint"></p>
      <label id="asr-lang-field" class="field inline-field" hidden><span data-i18n="asrLang"></span>
        <select id="asr-lang">
          <option value="sr" data-i18n="asrLangSr"></option>
          <option value="en" data-i18n="asrLangEn"></option>
        </select>
      </label>
      <label id="asr-gentle-field" class="inline-check" data-i18n-title="asrGentleHint" hidden><input id="asr-gentle" type="checkbox"> <span data-i18n="asrGentle"></span></label>
      <!-- Audio or a phone package dropped anywhere on this screen is taken; this area is where the eye goes. -->
      <div id="drop" class="drop" hidden>
        <span class="drop-hint" data-i18n="asrDropHint"></span>
        <button id="asr-pick" class="btn primary" type="button" data-i18n="asrPick"></button>
        <input id="asr-file" type="file" multiple accept="audio/*,.m4a,.mp3,.wav,.ogg,.opus,.aac,.flac,.amr,.3gp" hidden>
      </div>
      <p id="asr-model" class="muted small"></p>
      <p id="asr-why" class="asr-why" hidden></p>
    </section>
    <section class="saved">
      <div class="saved-head">
        <h2 data-i18n="savedTitle"></h2>
        <div class="saved-actions">
          <button id="merge-open" class="btn" type="button" data-i18n="mergeOpen" data-i18n-title="mergeHint" hidden></button>
          <button id="pick-bundle" class="btn" type="button" data-i18n="openBundle" data-i18n-title="openBundleHint"></button>
        </div>
        <input id="file" type="file" accept=".zip,application/zip" hidden>
      </div>
      <ul id="saved-list" class="saved-list"></ul>
      <p id="saved-empty" class="muted" data-i18n="savedEmpty" hidden></p>
    </section>
  </main>

  <main id="editor" class="view" hidden>
    <div class="ed-head">
      <button id="back" class="btn ghost" type="button" data-i18n="back"></button>
      <div class="ed-title">
        <div class="title-row">
          <h1 id="title"></h1>
          <button id="version-chip" class="chip" type="button">v1</button>
        </div>
        <p id="meta" class="muted"></p>
      </div>
      <span id="save-state" class="muted save-state" role="status"></span>
    </div>

    <div class="toolbar">
      <button id="save-phone" class="btn primary" type="button" data-i18n="saveForPhone" data-i18n-title="saveForPhoneHint"></button>
      <span class="menu-wrap">
        <button id="save-as" class="btn" type="button" aria-expanded="false" aria-controls="save-as-menu"><span data-i18n="saveAs"></span> <span aria-hidden="true">▾</span></button>
        <span id="save-as-menu" class="menu" hidden>
          <button class="menu-item" type="button" data-export="docx" data-i18n="exportDocx"></button>
          <button class="menu-item" type="button" data-export="txt" data-i18n="exportTxt"></button>
          <button class="menu-item" type="button" data-export="srt" data-i18n="exportSrt"></button>
          <button class="menu-item" type="button" data-export="vtt" data-i18n="exportVtt"></button>
        </span>
      </span>
      <button id="ai-request" class="btn" type="button" data-i18n="aiRequest"></button>
      <button id="ai-import" class="btn" type="button" data-i18n="aiImport"></button>
      <button id="save-version" class="btn" type="button" data-i18n="saveVersion" data-i18n-title="saveVersionHint"></button>
      <button id="history" class="btn" type="button" data-i18n="history"></button>
      <button id="speakers" class="btn" type="button" data-i18n="speakersPanel"></button>
      <button id="revert" class="btn ghost" type="button" data-i18n="revert"></button>
    </div>

    <div class="player" id="player">
      <button id="play" class="btn play" type="button" data-i18n-title="play" aria-label="Pusti">▶</button>
      <span id="time" class="time">00:00 / 00:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" data-i18n-aria="seek">
      <label class="inline"><span data-i18n="speed"></span>
        <select id="speed">
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </label>
      <label class="inline"><input id="autoscroll" type="checkbox" checked> <span data-i18n="autoscroll"></span></label>
      <span class="seg-toggle" role="group" data-i18n-aria="scriptToggle">
        <button id="script-lat" class="btn small" type="button" data-i18n="latin"></button>
        <button id="script-cyr" class="btn small" type="button" data-i18n="cyrillic"></button>
      </span>
      <button id="help" class="btn small ghost" type="button" data-i18n="help"></button>
      <audio id="audio" preload="metadata"></audio>
    </div>
    <p id="no-audio" class="muted note" data-i18n="noAudioNote" hidden></p>
    <p class="muted note" data-i18n="editHint"></p>
    <p id="ed-msg" class="msg" role="status" hidden></p>

    <ol id="lines" class="lines"></ol>
    <div id="spk-menu" class="menu spk-menu" hidden></div>
  </main>

  <dialog id="dlg-confirm" class="dlg" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="dlg-actions" id="confirm-actions"></div>
  </dialog>

  <dialog id="dlg-gem-line" class="dlg wide" aria-labelledby="gem-line-title">
    <h2 id="gem-line-title"></h2>
    <p id="gem-line-play"></p>
    <p class="muted small" data-i18n="gemLineNow"></p>
    <p id="gem-line-now"></p>
    <p class="muted small" data-i18n="gemLineNew"></p>
    <p id="gem-line-new" class="diff gem-diff"></p>
    <p class="muted small" data-i18n="gemLinePick"></p>
    <p class="muted small" data-i18n="gemLineResult"></p>
    <p id="gem-line-result"></p>
    <div class="dlg-actions">
      <button class="btn ghost" type="button" data-close data-i18n="cancel"></button>
      <button id="gem-line-accept" class="btn primary" type="button" data-i18n="gemLineAccept"></button>
    </div>
  </dialog>

  <dialog id="dlg-merge" class="dlg wide" aria-labelledby="merge-title">
    <h2 id="merge-title" data-i18n="mergeTitle"></h2>
    <p class="muted" data-i18n="mergeHint"></p>
    <ul id="merge-list" class="merge-list"></ul>
    <label class="field"><span data-i18n="mergeName"></span>
      <input id="merge-name" type="text" maxlength="200" autocomplete="off" spellcheck="false">
    </label>
    <div class="dlg-actions">
      <button class="btn ghost" type="button" data-close data-i18n="cancel"></button>
      <button id="merge-go" class="btn primary" type="button" data-i18n="mergeGo"></button>
    </div>
  </dialog>

  <dialog id="dlg-rename" class="dlg" aria-labelledby="rename-title">
    <h2 id="rename-title" data-i18n="renameTitle"></h2>
    <label class="field"><span data-i18n="renameLabel"></span>
      <input id="rename-input" type="text" maxlength="200" autocomplete="off" spellcheck="false">
    </label>
    <div class="dlg-actions">
      <button class="btn ghost" type="button" data-close data-i18n="cancel"></button>
      <button id="rename-save" class="btn primary" type="button" data-i18n="save"></button>
    </div>
  </dialog>

  <dialog id="dlg-asr" class="dlg wide" aria-labelledby="asr-dlg-title">
    <h2 id="asr-dlg-title" data-i18n="asrRunning"></h2>
    <p id="asr-file-name" class="muted"></p>
    <p id="asr-phase" role="status"></p>
    <progress id="asr-bar" class="asr-bar" max="1" value="0"></progress>
    <p id="asr-detail" class="muted small"></p>
    <p id="asr-last" class="asr-last" hidden></p>
    <p id="asr-queue" class="muted small"></p>
    <label class="field inline-field"><span data-i18n="asrLang"></span>
      <select id="asr-lang-dlg">
        <option value="sr" data-i18n="asrLangSr"></option>
        <option value="en" data-i18n="asrLangEn"></option>
      </select>
    </label>
    <label class="inline-check" data-i18n-title="asrGentleHint"><input id="asr-gentle-dlg" type="checkbox"> <span data-i18n="asrGentle"></span></label>
    <p class="muted small" data-i18n="asrStopHint"></p>
    <div class="dlg-actions">
      <button id="asr-stop" class="btn ghost" type="button" data-i18n="asrStop"></button>
      <button id="asr-bg" class="btn primary" type="button" data-i18n="asrBackground"></button>
    </div>
  </dialog>

  <dialog id="dlg-settings" aria-labelledby="settings-title" class="dlg">
    <h2 id="settings-title" data-i18n="settings"></h2>
    <h3 data-i18n="themeTitle"></h3>
    <label class="field"><span data-i18n="themeChoose"></span>
      <select id="theme-select">
        <option value="system" data-i18n="themeSystem"></option>
        <option value="light" data-i18n="themeLight"></option>
        <option value="dark" data-i18n="themeDark"></option>
      </select>
    </label>
    <section id="set-model" hidden>
      <h3 data-i18n="asrModelTitle"></h3>
      <p id="set-model-text" class="muted"></p>
      <button id="asr-delete-model" class="btn ghost small" type="button" data-i18n="asrDeleteModel" hidden></button>
    </section>
    <h3 data-i18n="gemTitle"></h3>
    <p class="muted" data-i18n="gemText"></p>
    <label class="field"><span data-i18n="gemKey"></span>
      <input id="gem-key" type="password" autocomplete="off" spellcheck="false" data-i18n-placeholder="gemKeyPlaceholder">
    </label>
    <label class="field"><span data-i18n="gemModel"></span><select id="gem-model"></select></label>
    <p id="gem-msg" class="msg" role="status" hidden></p>
    <p class="muted small" data-i18n="gemPrivacy"></p>
    <div class="dlg-actions">
      <button id="gem-clear" class="btn ghost" type="button" data-i18n="gemClear" hidden></button>
      <span class="spacer"></span>
      <button class="btn" type="button" data-close data-i18n="close"></button>
      <button id="gem-save" class="btn primary" type="button" data-i18n="gemSave"></button>
    </div>
  </dialog>

  <dialog id="dlg-help" aria-labelledby="help-title" class="dlg">
    <h2 id="help-title" data-i18n="helpTitle"></h2>
    <table class="keys">
      <tr><td><kbd>Ctrl</kbd>+<kbd>Space</kbd> · <kbd>Esc</kbd></td><td data-i18n="helpPlay"></td></tr>
      <tr><td><kbd>Alt</kbd>+<kbd>↑</kbd> / <kbd>Alt</kbd>+<kbd>↓</kbd></td><td data-i18n="helpPrevNext"></td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>R</kbd></td><td data-i18n="helpReplay"></td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>Enter</kbd></td><td data-i18n="helpSplit"></td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>Backspace</kbd></td><td data-i18n="helpJoin"></td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>1</kbd>…<kbd>9</kbd> · <kbd>0</kbd></td><td data-i18n="helpSpeaker"></td></tr>
      <tr><td>00:00</td><td data-i18n="helpClickTime"></td></tr>
    </table>
    <div class="dlg-actions"><button class="btn" type="button" data-close data-i18n="close"></button></div>
  </dialog>

  <dialog id="dlg-export" aria-labelledby="export-title" class="dlg">
    <h2 id="export-title"></h2>
    <p class="muted" data-i18n="exportColsText"></p>
    <fieldset class="cols">
      <legend class="sr-only" data-i18n="exportColsText"></legend>
      <label class="inline-check"><input id="ex-time" type="checkbox"> <span data-i18n="colTime"></span> <span id="ex-time-note" class="muted small" data-i18n="exportTimeAlways" hidden></span></label>
      <label id="ex-speaker-field" class="inline-check"><input id="ex-speaker" type="checkbox"> <span data-i18n="colSpeaker"></span></label>
      <label class="inline-check"><input type="checkbox" checked disabled> <span data-i18n="colText"></span></label>
    </fieldset>
    <div class="dlg-actions">
      <button class="btn ghost" type="button" data-close data-i18n="cancel"></button>
      <button id="ex-go" class="btn primary" type="button" data-i18n="exportSave"></button>
    </div>
  </dialog>

  <dialog id="dlg-speakers" aria-labelledby="speakers-title" class="dlg">
    <h2 id="speakers-title" data-i18n="speakersPanel"></h2>
    <p class="muted" data-i18n="speakersText"></p>
    <ul id="spk-list" class="spk-list"></ul>
    <p id="spk-empty" class="muted" data-i18n="speakersEmpty" hidden></p>
    <div class="dlg-actions">
      <button id="spk-add" class="btn" type="button" data-i18n="speakerNew"></button>
      <span class="spacer"></span>
      <button class="btn primary" type="button" data-close data-i18n="close"></button>
    </div>
  </dialog>

  <dialog id="dlg-history" aria-labelledby="history-title" class="dlg wide">
    <h2 id="history-title" data-i18n="historyTitle"></h2>
    <p class="muted" data-i18n="historyText"></p>
    <ul id="history-list" class="hist-list"></ul>
    <div class="dlg-actions"><button class="btn" type="button" data-close data-i18n="close"></button></div>
  </dialog>

  <dialog id="dlg-ai-request" aria-labelledby="ai-request-title" class="dlg wide">
    <h2 id="ai-request-title" data-i18n="aiRequestTitle"></h2>
    <p id="ai-request-note" class="muted"></p>
    <textarea id="ai-request-text" class="mono" rows="14" readonly aria-labelledby="ai-request-title"></textarea>
    <p id="ai-request-msg" class="msg" role="status" hidden></p>
    <div class="dlg-actions">
      <button id="ai-gemini" class="btn primary" type="button" hidden></button>
      <button id="ai-copy" class="btn primary" type="button" data-i18n="copy"></button>
      <button id="ai-download" class="btn" type="button" data-i18n="download"></button>
      <button class="btn ghost" type="button" data-close data-i18n="close"></button>
    </div>
  </dialog>

  <dialog id="dlg-ai-import" aria-labelledby="ai-import-title" class="dlg wide">
    <h2 id="ai-import-title" data-i18n="aiImportTitle"></h2>
    <p class="muted" data-i18n="aiImportText"></p>
    <textarea id="ai-answer" class="mono" rows="12" data-i18n-placeholder="aiPastePlaceholder" aria-labelledby="ai-import-title"></textarea>
    <p id="ai-import-msg" class="msg warn" role="status" hidden></p>
    <div class="dlg-actions">
      <button id="ai-check" class="btn primary" type="button" data-i18n="aiCheck"></button>
      <label class="btn"><input id="ai-file" type="file" accept=".txt,text/plain" hidden><span data-i18n="aiChooseFile"></span></label>
      <button class="btn ghost" type="button" data-close data-i18n="cancel"></button>
    </div>
  </dialog>

  <dialog id="dlg-ai-review" aria-labelledby="ai-review-title" class="dlg wide review">
    <div class="review-head">
      <h2 id="ai-review-title" data-i18n="aiReviewTitle"></h2>
      <p id="review-summary" class="muted"></p>
      <label class="coverage"><span id="review-coverage"></span><progress id="review-progress" max="1" value="0"></progress></label>
      <p id="review-partial" class="msg" hidden></p>
      <div class="dlg-actions start">
        <button id="review-all" class="btn small" type="button" data-i18n="aiAll"></button>
        <button id="review-none" class="btn small" type="button" data-i18n="aiNone"></button>
        <span class="spacer"></span>
        <button id="review-cancel" class="btn ghost" type="button" data-i18n="cancel"></button>
        <button id="review-apply" class="btn primary" type="button"></button>
      </div>
    </div>
    <ul id="review-list" class="review-list"></ul>
  </dialog>
</body>
</html>
