<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffc11b">
  <title>Moj Novi Sad — Transkript</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="version.js"></script>
  <script src="install.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="brand">
    <div class="brand-inner">
      <img class="logo" src="assets/mns-logo.png" alt="Moj Novi Sad" width="48" height="47">
      <div class="brand-text">
        <span class="app-name" data-i18n="appShort"></span>
        <span class="privacy" data-i18n="privacy"></span>
        <span class="version" id="app-version"></span>
      </div>
      <button id="install" class="btn primary install" type="button" data-i18n="install" hidden></button>
    </div>
  </header>

  <main id="start" class="view">
    <label id="drop" class="drop" tabindex="0">
      <input id="file" type="file" accept=".zip,application/zip" hidden>
      <span class="drop-title" data-i18n="dropTitle"></span>
      <span class="drop-hint" data-i18n="dropHint"></span>
      <span class="btn primary" data-i18n="pickFile"></span>
    </label>
    <p id="start-msg" class="msg" role="status" hidden></p>
    <section id="asr-card" class="asr-card" hidden>
      <div class="asr-text">
        <h2 data-i18n="asrTitle"></h2>
        <p class="muted" data-i18n="asrHint"></p>
        <p id="asr-model" class="muted small"></p>
        <p id="asr-why" class="asr-why" hidden></p>
      </div>
      <div class="asr-actions">
        <label id="asr-pick" class="btn primary" hidden><input id="asr-file" type="file" accept="audio/*,.m4a,.mp3,.wav,.ogg,.opus,.aac,.flac,.amr,.3gp" hidden><span data-i18n="asrPick"></span></label>
        <button id="asr-delete-model" class="btn ghost small" type="button" data-i18n="asrDeleteModel" hidden></button>
      </div>
    </section>
    <section class="saved">
      <h2 data-i18n="savedTitle"></h2>
      <ul id="saved-list" class="saved-list"></ul>
      <p id="saved-empty" class="muted" data-i18n="savedEmpty" hidden></p>
    </section>
  </main>

  <main id="editor" class="view" hidden>
    <div class="ed-head">
      <button id="back" class="btn ghost" type="button" data-i18n="back"></button>
      <div class="ed-title">
        <div class="title-row">
          <h1 id="title"></h1>
          <button id="version-chip" class="chip" type="button">v1</button>
        </div>
        <p id="meta" class="muted"></p>
      </div>
      <span id="save-state" class="muted save-state" role="status"></span>
    </div>

    <div class="toolbar">
      <button id="save-phone" class="btn primary" type="button" data-i18n="saveForPhone"></button>
      <span class="group">
        <span class="muted" data-i18n="exportLabel"></span>
        <button class="btn" type="button" data-export="txt" data-i18n="exportTxt"></button>
        <button class="btn" type="button" data-export="srt" data-i18n="exportSrt"></button>
        <button class="btn" type="button" data-export="vtt" data-i18n="exportVtt"></button>
      </span>
      <button id="ai-request" class="btn" type="button" data-i18n="aiRequest"></button>
      <button id="ai-import" class="btn" type="button" data-i18n="aiImport"></button>
      <button id="save-version" class="btn" type="button" data-i18n="saveVersion" data-i18n-title="saveVersionHint"></button>
      <button id="history" class="btn" type="button" data-i18n="history"></button>
      <button id="revert" class="btn ghost" type="button" data-i18n="revert"></button>
    </div>

    <div class="player" id="player">
      <button id="play" class="btn play" type="button" data-i18n-title="play" aria-label="Pusti">▶</button>
      <span id="time" class="time">00:00 / 00:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" data-i18n-aria="seek">
      <label class="inline"><span data-i18n="speed"></span>
        <select id="speed">
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </label>
      <label class="inline"><input id="autoscroll" type="checkbox" checked> <span data-i18n="autoscroll"></span></label>
      <span class="seg-toggle" role="group" data-i18n-aria="scriptToggle">
        <button id="script-lat" class="btn small" type="button" data-i18n="latin"></button>
        <button id="script-cyr" class="btn small" type="button" data-i18n="cyrillic"></button>
      </span>
      <button id="help" class="btn small ghost" type="button" data-i18n="help"></button>
      <audio id="audio" preload="metadata"></audio>
    </div>
    <p id="no-audio" class="muted note" data-i18n="noAudioNote" hidden></p>
    <p class="muted note" data-i18n="editHint"></p>
    <p id="ed-msg" class="msg" role="status" hidden></p>

    <ol id="lines" class="lines"></ol>
  </main>

  <dialog id="dlg-confirm" class="dlg">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="dlg-actions" id="confirm-actions"></div>
  </dialog>

  <dialog id="dlg-asr" class="dlg wide">
    <h2 id="asr-dlg-title" data-i18n="asrRunning"></h2>
    <p id="asr-file-name" class="muted"></p>
    <p id="asr-phase"></p>
    <progress id="asr-bar" class="asr-bar" max="1" value="0"></progress>
    <p id="asr-detail" class="muted small"></p>
    <p id="asr-last" class="asr-last" hidden></p>
    <p class="muted small" data-i18n="asrStopHint"></p>
    <div class="dlg-actions"><button id="asr-stop" class="btn" type="button" data-i18n="asrStop"></button></div>
  </dialog>

  <dialog id="dlg-help" class="dlg">
    <h2 data-i18n="helpTitle"></h2>
    <table class="keys">
      <tr><td><kbd>Ctrl</kbd>+<kbd>Space</kbd> · <kbd>Esc</kbd></td><td data-i18n="helpPlay"></td></tr>
      <tr><td><kbd>Alt</kbd>+<kbd>↑</kbd> / <kbd>Alt</kbd>+<kbd>↓</kbd></td><td data-i18n="helpPrevNext"></td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>R</kbd></td><td data-i18n="helpReplay"></td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>Enter</kbd></td><td data-i18n="helpSplit"></td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>Backspace</kbd></td><td data-i18n="helpJoin"></td></tr>
      <tr><td>00:00</td><td data-i18n="helpClickTime"></td></tr>
    </table>
    <div class="dlg-actions"><button class="btn" type="button" data-close data-i18n="close"></button></div>
  </dialog>

  <dialog id="dlg-history" class="dlg wide">
    <h2 data-i18n="historyTitle"></h2>
    <p class="muted" data-i18n="historyText"></p>
    <ul id="history-list" class="hist-list"></ul>
    <div class="dlg-actions"><button class="btn" type="button" data-close data-i18n="close"></button></div>
  </dialog>

  <dialog id="dlg-ai-request" class="dlg wide">
    <h2 data-i18n="aiRequestTitle"></h2>
    <p id="ai-request-note" class="muted"></p>
    <textarea id="ai-request-text" class="mono" rows="14" readonly></textarea>
    <p id="ai-request-msg" class="msg" role="status" hidden></p>
    <div class="dlg-actions">
      <button id="ai-copy" class="btn primary" type="button" data-i18n="copy"></button>
      <button id="ai-download" class="btn" type="button" data-i18n="download"></button>
      <button class="btn ghost" type="button" data-close data-i18n="close"></button>
    </div>
  </dialog>

  <dialog id="dlg-ai-import" class="dlg wide">
    <h2 data-i18n="aiImportTitle"></h2>
    <p class="muted" data-i18n="aiImportText"></p>
    <textarea id="ai-answer" class="mono" rows="12" data-i18n-placeholder="aiPastePlaceholder"></textarea>
    <p id="ai-import-msg" class="msg warn" role="status" hidden></p>
    <div class="dlg-actions">
      <button id="ai-check" class="btn primary" type="button" data-i18n="aiCheck"></button>
      <label class="btn"><input id="ai-file" type="file" accept=".txt,text/plain" hidden><span data-i18n="aiChooseFile"></span></label>
      <button class="btn ghost" type="button" data-close data-i18n="cancel"></button>
    </div>
  </dialog>

  <dialog id="dlg-ai-review" class="dlg wide review">
    <div class="review-head">
      <h2 data-i18n="aiReviewTitle"></h2>
      <p id="review-summary" class="muted"></p>
      <label class="coverage"><span id="review-coverage"></span><progress id="review-progress" max="1" value="0"></progress></label>
      <p id="review-partial" class="msg" hidden></p>
      <div class="dlg-actions start">
        <button id="review-all" class="btn small" type="button" data-i18n="aiAll"></button>
        <button id="review-none" class="btn small" type="button" data-i18n="aiNone"></button>
        <span class="spacer"></span>
        <button id="review-cancel" class="btn ghost" type="button" data-i18n="cancel"></button>
        <button id="review-apply" class="btn primary" type="button"></button>
      </div>
    </div>
    <ul id="review-list" class="review-list"></ul>
  </dialog>
</body>
</html>
